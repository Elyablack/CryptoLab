[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolab"
version = "1.0.0"
description = "Research platform for cryptocurrency market analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
cryptolab = "cryptolab.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]
release = [
    "build>=1.2,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F"]

