name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/constraints.txt
      - name: Install constrained test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints.txt ".[test]"
      - name: Run socket-blocked tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Smoke-test all CLI commands
        run: |
          cryptolab --help
          for command in collect quality analyze signals backtest research; do
            cryptolab "$command" --help
          done

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install -c requirements/constraints.txt "build>=1.2,<2"
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/cryptolab-wheel-test
          /tmp/cryptolab-wheel-test/bin/python -m pip install dist/cryptolab-*.whl
          /tmp/cryptolab-wheel-test/bin/cryptolab --help
          for command in collect quality analyze signals backtest research; do
            /tmp/cryptolab-wheel-test/bin/cryptolab "$command" --help
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cryptolab-distributions
          path: dist/*
          if-no-files-found: error

  static-checks:
    name: Static repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install -c requirements/constraints.txt "ruff>=0.8,<1"
      - name: Lint
        run: ruff check src tests scripts
      - name: Check whitespace
        run: git diff --check
